# ~/.config/walker/config.toml

[ui]
  # Window dimensions
  width = 600
  height = 400
  
  # Center the window on the monitor
  anchors = { top = true, bottom = true, left = true, right = true }
  
  # Remove window decorations (optional, looks cleaner in Hyprland)
  window_decorations = true

# Search Bar settings
[search]
  placeholder = "Search..."
  
# This block connects the UI to the Elephant backend data
[[list]]
  name = "applications"
  placeholder = "Applications"
  always_show = true
[[list]]
  name = "bluetooth"
  placeholder = "Bluetooth Devices"
[[list]]
  name = "clipboard"
  placeholder = "Clipboard"
  exec = "cliphist list"

[[action]]
name = "copy"
exec = "echo '%s' | cliphist decode | wl-copy --type text/plain"

# Enable walker's built-in clipboard provider
[providers.clipboard]
disabled = true

[modules.clipboard]
disabled = true
