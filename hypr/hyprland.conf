source = ~/.cache/wal/colors-hyprland.conf

################
### MONITORS ###
################
monitor = , preferred, auto, 1
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1

###################
### MY PROGRAMS ###
###################
$terminal = ghostty && $SHELL
$fileManager = dolphin
$menu = walker
$browser = brave
$browser2 = microsoft-edge-dev
$whatsapp = microsoft-edge-dev "https://web.whatsapp.com/"

# Scripts
$waybarHider = ~/.config/hypr/waybar_hider.sh
$wallpaperSwicther = ~/.config/hypr/wallpaperSwitcher.sh
$menu_fix = menu_fix.sh

#################
### AUTOSTART ###
#################
# exec-once = copyq
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle
exec-once = waybar
exec-once = awww-daemon
exec-once = swaync
exec-once = pypr
exec-once = swaync-client -df
exec-once = elephant
exec-once = walker --gapplication-service
exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0
# exec-once = hyprctl plugin load $HOME/.local/share/hyprpm/dynamic-cursors/dynamic-cursors.so
exec-once = wl-paste --type text --watch cliphist store
# exec-once = wl-paste --type image --watch cliphist store -max-items 50
# Initial dropterm start
exec-once = [workspace special:dropdown silent] ghostty --class=ghostty-dropdown
exec-once = $wallpaperSwicther
exec-once = $menu_fix
# exec-once = hyprpm update
exec-once = ~/.config/hypr/scripts/osd_listener.sh
exec-once = ~/.config/hypr/scripts/audio_fix.sh
# exec-once = /usr/lib/xdg-desktop-portal-hyprland &
# exec-once = /usr/lib/xdg-desktop-portal &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DBUS_SESSION_BUS_ADDRESS
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_RUNTIME_DIR HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = GDK_BACKEND,wayland
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,20
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = WLR_NO_HARDWARE_CURSORS,1

###############
### GENERAL ###
###############
general {
    gaps_in = 7
    gaps_out = 8
    border_size = 4
    col.active_border = $color14
    col.inactive_border = $color1
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

##################
### DECORATION ###
##################
decoration {
    rounding = 10
    active_opacity = 0.97
    inactive_opacity = 0.89
    fullscreen_opacity = 1

#    blur {
 #       enabled = false
  #      size = 3
   #     passes = 5
    #    new_optimizations = true
     #   ignore_opacity = true
      #  xray = false
       # popups = true
    #}
    
    shadow {
        enabled = true
        range = 15
        render_power = 5
        color = rgba(0,0,0,.5)
    }
}

##################
### ANIMATIONS ###
##################
animations {
    enabled = true
    bezier = fluid, 0.15, 0.85, 0.25, 1
    bezier = snappy, 0.3, 1, 0.4, 1
    
    animation = windows, 1, 3, fluid, popin 5%
    animation = windowsOut, 1, 2.5, snappy
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 1.7, snappy, slide
    animation = specialWorkspace, 1, 4, fluid, slidefadevert -35%
    animation = layers, 1, 2, snappy, popin 70%
}

###############
### LAYOUTS ###
###############
dwindle {
    preserve_split = true
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 
    natural_scroll = true
    }

cursor {
    no_hardware_cursors = true
}


# 1:1 Gestures (New Syntax)
gesture = 3, horizontal, workspace
gesture = 3, up, mod: SUPER, scale: 1.5, fullscreen

device {
    name = epic-mouse-v1
    sensitivity = 0
}

############
### MISC ###
############
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
    vrr = 0
}

render {
    direct_scanout = 0
}

####################
### KEYBINDINGSS ###
####################
$mainMod = SUPER

bind = $mainMod, Return, exec, sh -c "$terminal -e sh -c 'fastfetch;bash'"
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser --ozone-platform-hint=auto
bind = $mainMod, A, exec, $browser2 --ozone-platform=wayland --enable-features=UseOzonePlatform,WaylandWindowDecorations
bind = $mainMod, C, exec, microsoft-edge-stable --ozone-platform=wayland --enable-features=UseOzonePlatform,WaylandWindowDecorations "https://web.whatsapp.com/"
bind = $mainMod SHIFT, S, exec, $wallpaperSwicther
bind = $mainMod SHIFT, Q, exec, $waybarHider

# Terminal / Editor
bind = $mainMod, N, exec, ghostty --working-directory=/mnt/D/Notes/ -e nvim Notes.txt
bind = $mainMod, V, togglefloating
# Use walker's clipboard list (cliphist backend)
bind = $mainMod SHIFT, V, exec, walker -m clipboard
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo
# bind = $mainMod, J, togglesplit
bind = $mainMod, F, fullscreen

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Media & Hardware Keys
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5 --allow-boost
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindel = , XF86AudioMute, exec, pamixer -t
bindel = , XF86AudioMicMute, exec, pamixer --default-source -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Gradient scripts removed

# Window Movement
bind = ALT, left, movewindow, l
bind = ALT, right, movewindow, r
bind = ALT, up, movewindow, u
bind = ALT, down, movewindow, d

# Screenshots & System
bind = CTRL, Print, exec, grim -g "$(slurp -b 00000000 -c 00000000 -w 0)" - | wl-copy -t image/png && wl-paste -t image/png | swappy -f -
bind = , Print, exec, hyprshot -m window -o ~/Screenshots/
bind = ALT, Print, exec, hyprshot -m active -m output -o ~/Screenshots/
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp -b 00000000 -c 00000000 -w 0)" - | wl-copy -t image/png
bind = $mainMod, l, exec, hyprlock
bind = $mainMod, S, exec, wlogout -b 2
bind = $mainMod, M, exit

# Wallpaper & Waybar
bind = ALT, w, exec, $wallpaperSwicther
bind = ALT, a, exec, ~/.config/waybar/scripts/refresh.sh
bind = ALT, B, exec, ~/.config/waybar/scripts/select.sh
bind = ALT, R, exec, ~/.config/swaync/refresh.sh

# Pyprland
bind = $mainMod, G, exec, pypr toggle music
bind = $mainMod SHIFT, R, exec, pypr reload
bind = $mainMod, T, exec, pypr toggle taskbar

# Special Workspace / Dropdown
bind = ALT, TAB, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic
bind = $mainMod, SPACE, togglespecialworkspace, dropdown

# Mouse Binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

##############################
### WINDOWS AND WORKSPACES ###
##############################

# --- Wi-Fi Manager Popup ---
windowrule {
    name = wifi-manager-popup
    match:title = ^(Wi-Fi Manager)$
    float = on
    size = 600 720
    center = on
    stay_focused = on
}

# --- Flameshot Fixes ---


# HyprMod managed settings
source = ~/.config/hypr/hyprland-gui.conf
